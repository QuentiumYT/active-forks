<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Active GitHub Forks</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4/css/font-awesome.min.css">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/datatables.net-searchbuilder-bs5@1/css/searchBuilder.bootstrap5.min.css" />

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@3"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/popper.js@1"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/moment@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/darkmode-js@1"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/datatables.net@2/js/dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2/js/dataTables.bootstrap5.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/datatables.net-searchbuilder@1/js/dataTables.searchBuilder.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/datatables.net-searchbuilder-bs5@1/js/searchBuilder.bootstrap5.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="mt-4 mb-2">
    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-lg-12">
                <div class="card">
                    <header class="card-header text-center">
                        <nav class="h3 mb-0">
                            <a href="https://github.com/QuentiumYT/active-forks" class="text-dark">
                                <span class="sr-only">Source code on GitHub</span>
                                <i class="fa fa-github-alt pull-left" aria-hidden="true"></i>
                            </a>
                        </nav>
                        <h1 class="h3">
                            Active GitHub Forks
                        </h1>
                    </header>

                    <main class="card-body">
                        <search class="mb-3">
                            <form id="form" role="form">
                                <div class="input-group">
                                    <input id="q" name="q" class="form-control" type="text" placeholder="QuentiumYT/Stacer" spellcheck="false">
                                    <input id="branch" name="branch" class="form-control" type="text" placeholder="main">
                                    <span class="ms-3">
                                        <button id="find" onClick="fetchData()" type="submit" class="btn btn-primary">
                                            <i id="spinner" class="fa fa-spinner fa-pulse fa-fw d-none"></i>
                                            <span class="find-label">Find</span>
                                        </button>
                                        <button id="findDiff" onClick="fetchData(true)" type="submit" class="btn btn-primary">
                                            <i id="spinner" class="fa fa-spinner fa-pulse fa-fw d-none"></i>
                                            <span class="find-label">Find with diff</span>
                                        </button>
                                    </span>
                                </div>

                                <div class="input-group mt-2 d-flex justify-content-end">
                                    <input id="token" name="token" class="form-control collapsible-content" type="text" placeholder="Auth Token">
                                    <span class="ms-3">
                                        <button id="collapsible" onClick="toggleToken()" type="button" class="btn btn-primary collapsible">
                                            Hide Token
                                        </button>
                                        <a href="https://help.github.com/en/github/authenticating-to-github/creating-a-personal-access-token-for-the-command-line" class="btn btn-success" target="_blank">
                                            Info
                                        </a>
                                        <button onClick="return false" class="btn btn-primary options-button" data-bs-toggle="collapse" data-bs-target="#options" role="button" aria-expanded="false" aria-controls="options">
                                            Options
                                        </button>
                                    </span>
                                    <span class="quota ms-3 d-none">
                                        <button id="rate-limit" type="button" class="btn btn-primary py-0 h-100"></button>
                                    </span>
                                </div>

                                <div class="options collapse mt-2 px-3" id="options">
                                    <div class="card bg-light card-body">
                                        <div class="d-flex align-items-center">
                                            <label for="maxRecords">Max records:</label>
                                            <input id="maxRecords" name="maxRecords" class="form-control ms-3 me-5 w-auto" type="number" min="10">

                                            <p class="mb-0">Assume same commits if:</p>

                                            <input id="sameSize" name="sameSize" class="form-check-input ms-3 me-1" type="checkbox">
                                            <label for="sameSize" class="form-check-label">Same Size</label>

                                            <input id="samePushDate" name="samePushDate" class="form-check-input ms-3 me-1" type="checkbox">
                                            <label for="samePushDate" class="form-check-label">Same Push Date</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="progress mt-2">
                                    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%;">
                                        0 / 0
                                    </div>
                                </div>
                            </form>
                        </search>

                        <div id="data-body"></div>
                        <table id="forkTable" class="display table-sm table-striped" width="100%"></table>
                    </main>

                    <footer id="footer" class="card-footer text-muted">
                    </footer>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
